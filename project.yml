name: Branch
options:
  bundleIdPrefix: com.anthilori.branch
  deploymentTarget:
    iOS: "17.0"
settings:
  DEVELOPMENT_TEAM: ""
targets:
  Branch:
    type: application
    platform: iOS
    sources:
      - path: Branch/Sources
      - path: Branch/Resources
    info:
      path: Branch/Sources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anthilori.branch
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
